services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-codex_skilled}
      MYSQL_USER: ${MYSQL_USER:-codex}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-codex-password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    container_name: backend
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-codex}:${MYSQL_PASSWORD:-codex-password}@mysql:3306/${MYSQL_DATABASE:-codex_skilled}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      WORKSPACE_ROOT: /workspace-data
      RUNNER_URL: ${RUNNER_URL:-http://runner:4317}
      HOST_RUNNER_URL: ${HOST_RUNNER_URL:-http://runner:4317}
      RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET:-change-me}
    ports:
      - "3000:3000"
    volumes:
      - ./workspace-data:/workspace-data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    container_name: frontend
    environment:
      NG_APP_API_URL: ${NG_APP_API_URL:-http://localhost:3000}
      NG_APP_FIREBASE_API_KEY: ${NG_APP_FIREBASE_API_KEY}
      NG_APP_FIREBASE_AUTH_DOMAIN: ${NG_APP_FIREBASE_AUTH_DOMAIN}
      NG_APP_FIREBASE_PROJECT_ID: ${NG_APP_FIREBASE_PROJECT_ID}
      NG_APP_FIREBASE_APP_ID: ${NG_APP_FIREBASE_APP_ID:-}
    ports:
      - "4200:80"
    depends_on:
      - backend

  runner:
    build:
      context: ./runner
    profiles:
      - linux
    restart: unless-stopped
    container_name: runner
    env_file:
      - .env
    environment:
      RUNNER_PORT: 4317
      CONTAINER_WORKSPACE_ROOT: /workspace-data
      RUNNER_CLI_BIN_DIRS: ${RUNNER_CLI_BIN_DIRS:-/opt/agent-cli/bin}
      RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET:-change-me}
      RUNNER_JOB_TIMEOUT_MS: ${RUNNER_JOB_TIMEOUT_MS:-900000}
      RUNNER_AGENT_CODEX_HOME_HOST_DIR: ${RUNNER_AGENT_CODEX_HOME_HOST_DIR:-}
      RUNNER_AGENT_CLAUDE_HOME_HOST_DIR: ${RUNNER_AGENT_CLAUDE_HOME_HOST_DIR:-}
    volumes:
      - ./workspace-data:/workspace-data
      - runner_state:/root
      - ${RUNNER_CLI_HOST_BIN_DIR:?RUNNER_CLI_HOST_BIN_DIR must point to the host CLI bin directory}:/opt/agent-cli/bin:ro
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "4317"
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:4317/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 10

  market-research-codex-image:
    build:
      context: ./runner
      dockerfile: Dockerfile.market-research-codex
    image: codex-skilled/market-research-codex:local
    container_name: market-research-codex-image
    profiles:
      - agent-images
    command: [ "true" ]

  market-research-claude-image:
    build:
      context: ./runner
      dockerfile: Dockerfile.market-research-claude
    image: codex-skilled/market-research-claude:local
    container_name: market-research-claude-image
    profiles:
      - agent-images
    command: [ "true" ]

volumes:
  mysql_data:
  redis_data:
  runner_state:
